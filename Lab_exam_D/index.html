<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Tech Connect - Event Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Global Tech Connect</h1>
      <p class="description">
        Register for our upcoming workshop, webinar, and networking event.
      </p>

      <!-- Registration Section -->
      <div class="section">
        <h2>Event Registration</h2>

        <form id="registrationForm">
          <!-- Full Name -->
          <div class="form-group">
            <label>Full Name <span class="required">*</span></label>
            <input type="text" id="name" placeholder="Enter your full name" maxlength="100" />
            <small class="error" id="nameError"></small>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label>Professional Email <span class="required">*</span></label>
            <input type="email" id="email" placeholder="Enter your email" />
            <small class="error" id="emailError"></small>
          </div>

          <!-- Company -->
          <div class="form-group">
            <label for="company">Company / Institution</label>
            <input type="text" id="company" placeholder="Enter company name" maxlength="100" />
            <small class="error" id="companyError"></small>
          </div>

          <!-- Attendance Type -->
          <div class="form-group">
            <label>Attendance Type <span class="required">*</span></label>

            <div class="radio-group">
              <label>
                <input type="radio" name="attendance" value="Virtual" />
                Virtual
              </label>

              <label>
                <input type="radio" name="attendance" value="In-Person" />
                In-Person
              </label>
            </div>

            <small class="error" id="attendanceError"></small>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn">Register</button>

          <!-- Success Message -->
          <p class="success" id="successMessage"></p>
        </form>
      </div>

      <!-- Analytics Section -->
      <div class="section">
        <h2>Analytics</h2>

        <button id="analyticsBtn" class="btn secondary-btn" type="button">
          Show Event Analytics
        </button>

        <div id="analyticsPanel" class="analytics hidden">
          <p><strong>Total Registrants:</strong> <span id="totalCount">0</span></p>
          <p><strong>Virtual:</strong> <span id="virtualCount">0</span></p>
          <p><strong>In-Person:</strong> <span id="inPersonCount">0</span></p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
